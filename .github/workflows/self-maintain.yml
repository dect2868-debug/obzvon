name: Самообслуживание ОБЗВОН

# Сайт обслуживает себя сам: проверяет проект, чинит известные сбои,
# поднимает версию и раскладывает её по всем файлам. Ручной запуск:
# Actions → Самообслуживание ОБЗВОН → Run workflow.
on:
  push:
    branches: [main]
  schedule:
    # каждый день в 05:27 UTC — ночная проверка живости
    - cron: '27 5 * * *'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Как поднять версию'
        required: false
        default: 'patch'
        type: choice
        options: [patch, minor, major, none]

permissions:
  contents: write   # коммит версии и status.json
  issues: write     # задача, если проверки не прошли

concurrency:
  group: self-maintain
  cancel-in-progress: false

jobs:
  maintain:
    name: Проверка и обновление
    runs-on: ubuntu-latest
    steps:
      - name: Взять код
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Установить зависимости
        run: npm ci --no-audit --no-fund

      - name: Диагностика проекта
        run: node tools/doctor.js

      - name: Тесты
        run: npm test

      - name: Не трогать собственные коммиты бота
        id: who
        run: |
          AUTHOR="$(git log -1 --format='%an')"
          if [ "$AUTHOR" = "obzvon-bot" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Поднять версию и разнести по файлам
        if: steps.who.outputs.skip == 'false'
        run: |
          KIND="${{ github.event.inputs.bump || 'patch' }}"
          if [ "$KIND" = "none" ]; then
            node tools/bump.js --sync
          else
            node tools/bump.js --bump "$KIND" --notes "авто-обновление: проверки пройдены"
          fi

      - name: Записать статус автоподдержки
        if: always()
        run: node tools/status.js "${{ job.status == 'success' && 'ok' || 'failed' }}" "прогон ${{ github.run_number }}"

      - name: Закоммитить изменения
        if: steps.who.outputs.skip == 'false'
        run: |
          git config user.name "obzvon-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "изменений нет — коммит не нужен"
            exit 0
          fi
          V="$(node -p "require('./version.json').v")"
          git commit -m "chore: авто-обновление v$V"
          git tag -a "v$V" -m "v$V"
          git push
          git push --tags

      - name: Задача при сбое проверок
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Автоподдержка: проверка не пройдена"
          BODY="$(node -e "
            const fs=require('fs');
            let log='';
            try { log = fs.readFileSync('status.json','utf8'); } catch(e) {}
            process.stdout.write('Прогон ' + process.env.GITHUB_RUN_NUMBER + ' не прошёл.\n\n' + log);
          ")"
          # обновляем прошлую задачу, если она уже открыта
          NUM="$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY" || true
          else
            gh issue create --title "$TITLE" --body "$BODY" || true
          fi

      - name: Отчёт о проверке
        if: always()
        run: |
          {
            echo "### Автоподдержка ОБЗВОН — ${{ job.status }}"
            echo ""
            echo "- версия: $(node -p "require('./version.json').v" 2>/dev/null || echo '—')"
            echo "- коммит: $(git rev-parse --short HEAD 2>/dev/null || echo '—')"
            echo "- ссылка: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
